name: Deploy Wilma Retro Quiz to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cat .site/index.b64.* | base64 --decode > index.html.gz
          echo "73c6482a9bcb986b071e20583306015f20b16469d91330ddb3e444d59d882e0a  index.html.gz" | sha256sum --check -
          gzip -dc index.html.gz > site/index.html

          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()

          # Keep the always-available next-song control from the previous release.
          s = s.replace(
              '<button class="action-btn" id="revealBtn">REVEAL</button>',
              '<button class="action-btn" id="revealBtn">REVEAL</button>\n            <button class="action-btn" id="skipBtn">NEXT SONG →</button>'
          )
          s = s.replace(
              '<button class="next-btn" id="nextBtn" disabled>NEXT SIGNAL →</button>',
              '<button class="next-btn" id="nextBtn">NEXT SONG →</button>'
          )
          s = s.replace(
              "$('#revealBtn').disabled=false; $('#nextBtn').disabled=true;",
              "$('#revealBtn').disabled=false; $('#nextBtn').disabled=false;"
          )
          s = s.replace(
              "$('#playBtn').addEventListener('click',playClip); $('#revealBtn').addEventListener('click',reveal); $('#hintBtn').addEventListener('click',hint); $('#nextBtn').addEventListener('click',newRound);",
              "$('#playBtn').addEventListener('click',playClip); $('#revealBtn').addEventListener('click',reveal); $('#hintBtn').addEventListener('click',hint); $('#skipBtn').addEventListener('click',()=>newRound()); $('#nextBtn').addEventListener('click',()=>newRound());"
          )

          # Rename every visible/app-shell occurrence without changing the repository URL.
          s = s.replace('Kobus’s Retro Quiz', 'Wilma’s Retro Quiz')
          s = s.replace('KOBUS’S RETRO QUIZ', 'WILMA’S RETRO QUIZ')
          s = s.replace('Kobus Retro Quiz', 'Wilma Retro Quiz')
          s = s.replace('KOBUS RETRO QUIZ', 'WILMA RETRO QUIZ')

          # Vibrant animated neon quiz prompt.
          neon_css = r'''
          #mysteryTitle.quiz-prompt-neon {
            text-transform: uppercase;
            letter-spacing: .035em;
            background: linear-gradient(90deg,#5ef4ff 0%,#ff4db8 24%,#9b6cff 49%,#ffd166 72%,#5ef4ff 100%);
            background-size: 260% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            filter: saturate(1.3);
            animation: quizPromptFlow 3.2s linear infinite, quizPromptPulse 1.7s ease-in-out infinite alternate;
          }
          @keyframes quizPromptFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 260% 50%; }
          }
          @keyframes quizPromptPulse {
            0% { text-shadow: 0 0 7px rgba(94,244,255,.55), 0 0 15px rgba(255,77,184,.28); transform: translateY(0) scale(1); }
            100% { text-shadow: 0 0 11px rgba(255,77,184,.78), 0 0 24px rgba(155,108,255,.48), 0 0 34px rgba(255,209,102,.2); transform: translateY(-1px) scale(1.018); }
          }
          @media (prefers-reduced-motion: reduce) {
            #mysteryTitle.quiz-prompt-neon { animation: none; background-position: 50% 50%; }
          }
          '''
          s = s.replace('</style>', neon_css + '\n</style>', 1)

          # Initial prompt and randomized prompt on every fresh round.
          s = s.replace('<h1 class="mystery-title" id="mysteryTitle">Name that tune.</h1>', '<h1 class="mystery-title quiz-prompt-neon" id="mysteryTitle">NAME THAT BAND</h1>')
          s = s.replace(
              "$('#mysteryTitle').textContent='Name that tune.';",
              "$('#mysteryTitle').classList.add('quiz-prompt-neon'); $('#mysteryTitle').textContent=Math.random()<0.5?'NAME THAT BAND':'NAME THAT SONG';"
          )

          p.write_text(s)
          PY

          cat > site/manifest.webmanifest <<'JSON'
          {
            "name": "Wilma’s Retro Quiz",
            "short_name": "Wilma Retro Quiz",
            "description": "An animated 80s and 90s retro-radio music quiz trainer.",
            "start_url": "./index.html",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait-primary",
            "background_color": "#060712",
            "theme_color": "#070915"
          }
          JSON
          cat > site/sw.js <<'JS'
          const CACHE='wilma-retro-quiz-v4';
          const SHELL=['./','./index.html','./manifest.webmanifest'];
          self.addEventListener('install',event=>event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(SHELL))));
          self.addEventListener('activate',event=>event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))));
          self.addEventListener('fetch',event=>{const u=new URL(event.request.url);if(u.origin!==location.origin)return;event.respondWith(caches.match(event.request).then(r=>r||fetch(event.request).then(resp=>{const copy=resp.clone();caches.open(CACHE).then(c=>c.put(event.request,copy));return resp;}).catch(()=>caches.match('./index.html'))));});
          JS

          test -s site/index.html
          grep -q "Wilma’s Retro Quiz" site/index.html
          grep -q "WILMA’S RETRO QUIZ" site/index.html
          ! grep -q "Kobus" site/index.html
          ! grep -q "KOBUS" site/index.html
          grep -q 'id="skipBtn"' site/index.html
          grep -q 'NEXT SONG' site/index.html
          grep -q 'NAME THAT BAND' site/index.html
          grep -q 'NAME THAT SONG' site/index.html
          grep -q 'quiz-prompt-neon' site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
